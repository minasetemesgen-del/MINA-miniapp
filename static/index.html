<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2a0030">
  <title>ETFPL</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ET</span>
      <div class="brand-text">
        <strong>ETFPL</strong>
        <small id="subtitle">Weekly FPL Contest</small>
      </div>
    </div>
    <div class="top-actions">
    <button class="icon-btn" id="admin-btn" aria-label="Admin dashboard" hidden>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" id="bell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot" id="bell-dot" hidden>0</span>
    </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><i data-icon="home"></i><span>Home</span></button>
    <button data-tab="board"><i data-icon="trophy"></i><span>Top 10</span></button>
    <button data-tab="wallet"><i data-icon="wallet"></i><span>Wallet</span></button>
    <button data-tab="pl"><i class="pl-logo"></i><span>Premier</span></button>
    <button data-tab="team"><i data-icon="shirt"></i><span>My Team</span></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="Notifications">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Notifications</h2>
      <button class="link-btn" id="sheet-close">Close</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=6"></script>
  <script src="/admin.js?v=6"></script>
</body>
</html>
